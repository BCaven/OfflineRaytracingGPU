# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: CMake on a single platform

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  VULKAN_SDK_VERSION: 1.4.350.0

jobs:
  build:
    # The CMake configure and build commands are platform agnostic and should work equally well on Windows or Mac.
    # You can convert this to a matrix build if you need cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Vulkan SDK
      shell: pwsh
      run: |
        $version = "${{ env.VULKAN_SDK_VERSION }}"
        $installer = "$env:RUNNER_TEMP\vulkan-sdk.exe"
        $sdkPath = "C:\VulkanSDK\$version"

        Write-Host "Vulkan SDK version: $version"
        Write-Host "Expected SDK path: $sdkPath"
        
        Invoke-WebRequest `
          -Uri "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe" `
          -OutFile $installer
        
        & $installer `
          --accept-licenses `
          --default-answer `
          --confirm-command `
          install `
          com.lunarg.vulkan.volk `
          com.lunarg.vulkan.vma `
          com.lunarg.vulkan.sdl2 `
          com.lunarg.vulkan.glm

        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        Write-Host "Environment after installation:"
        Get-ChildItem Env: | Where-Object { $_.Name -like "*VULKAN*" }

        Write-Host "C:\VulkanSDK:"
        Get-ChildItem "C:\VulkanSDK" -ErrorAction SilentlyContinue

        if (-not (Test-Path $sdkPath)) {
          throw "Vulkan SDK was not installed at $sdkPath"
        }
        
        "VULKAN_SDK=$sdkPath" >> $env:GITHUB_ENV
    
    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: cmake -S ${{github.workspace}}/OfflineRaytracingGPU -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
  
    - name: Build
      # Build your program with the given configuration
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Inspect executable dependencies
      shell: pwsh
      run: |
        $exe = "${{ github.workspace }}\build\bin\${{ env.BUILD_TYPE }}\OfflineRaytracingGPU.exe"

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

        $vsPath = & $vswhere -latest -products * -property installationPath

        Write-Host "Visual Studio: $vsPath"

        $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"

        Write-Host "Developer command file: $devCmd"

        cmd /c "`"$devCmd`" -arch=x64 && dumpbin /DEPENDENTS `"$exe`""
        
    - name: Package executable
      shell: pwsh
      run: |
        $package = "${{ github.workspace }}\package"
        $bin = "${{ github.workspace }}\build\bin\${{ env.BUILD_TYPE }}"
    
        New-Item -ItemType Directory -Force -Path $package | Out-Null
    
        Copy-Item "$bin\OfflineRaytracingGPU.exe" $package
    
        Copy-Item "$env:VULKAN_SDK\Bin\SDL3.dll" $package
        Copy-Item "$env:VULKAN_SDK\Bin\slang.dll" $package
    
        Compress-Archive `
          -Path "$package\*" `
          -DestinationPath "${{ github.workspace }}\OfflineRaytracingGPU.zip"
